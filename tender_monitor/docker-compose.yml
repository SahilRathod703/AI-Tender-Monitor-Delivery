version: "3.9"

services:
  tender_monitor:
    build: .
    container_name: tender_monitor
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data              # Persist SQLite database
      - ./logs:/app/logs              # Persist log files
      - ./credentials.json:/app/credentials.json:ro  # Google service account
    environment:
      - TZ=Asia/Kolkata

  # ── Optional: PostgreSQL for production ───────────────────────
